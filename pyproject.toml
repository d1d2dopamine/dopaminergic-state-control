[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dopaminergic-state-control"
version = "0.5.0"
description = "Reproducible discovery engine for unusual structure in the MaleCNS dopaminergic network."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "d1d2dopamine"}]
dependencies = [
  "networkx>=3.4,<4",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "pyarrow>=18,<22",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
dsc = "dsc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
