name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest
      - name: Check browser scripts
        run: |
          node --check site/assets/app.js
          node --check site/assets/brain.js
      - name: Rebuild demo research site
        run: dsc run --snapshot data/demo --config configs/demo.yml --output build/demo --site-template site
      - name: Verify generated site payload
        run: |
          test -s build/demo/findings.json
          test -s build/demo/run_manifest.json
          test ! -e build/demo/site/data/network.json
          test -s build/demo/site/data/run.json
          test -s build/demo/site/assets/brain.js
      - uses: actions/upload-artifact@v4
        with:
          name: discovery-demo
          path: build/demo/
