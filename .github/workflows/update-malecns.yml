name: Update MaleCNS dopamine snapshot
on:
  workflow_dispatch:
    inputs:
      min_synapses:
        description: Primary analysis edge threshold (snapshot still retains weight >= 1 for robustness)
        required: true
        default: '3'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: malecns-research
  cancel-in-progress: false
jobs:
  build-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -e .
      - name: Cache official MaleCNS flat files
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/male-cns-v1.0
          key: male-cns-v1.0-flat-v1
      - name: Cache compact MaleCNS ROI availability metadata
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/male-cns-v1.0-roi-meta
          key: male-cns-v1.0-roi-meta-v2
      - name: Cache compact MaleCNS cross-dataset identity metadata
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/male-cns-v1.0-identity-meta
          key: male-cns-v1.0-identity-meta-v1
      - name: Cache PAM04 external replication sources
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pam04-replication-sources
          key: pam04-replication-banc888-flywire783-v1
      - name: Build bounded dopamine snapshot + full-degree controls
        run: |
          dsc fetch-malecns \
            --raw-dir "${{ runner.temp }}/male-cns-v1.0" \
            --output build/male-cns-v1.0-dopamine \
            --min-synapses "${{ inputs.min_synapses }}" \
            --snapshot-floor 1 \
            --roi-cache "${{ runner.temp }}/male-cns-v1.0-roi-meta/roi-availability.json.gz" \
            --identity-cache "${{ runner.temp }}/male-cns-v1.0-identity-meta/identity.json.gz"
      - name: Run peer-aware discovery and null tests
        run: dsc run --snapshot build/male-cns-v1.0-dopamine --config configs/discovery.yml --output build/research --site-template site --min-synapses "${{ inputs.min_synapses }}"
      - name: Replicate Experiment 001 across BANC v888 and FlyWire v783
        run: |
          dsc pam04-replication \
            --experiment build/research/experiment_001_pam04.json \
            --output build/research/experiment_001_replication.json \
            --cache-dir "${{ runner.temp }}/pam04-replication-sources"
          cp build/research/experiment_001_replication.json build/research/site/data/experiments/001_pam04_replication.json
      - name: Reproduce committed Experiment 001 State Lab scenarios
        shell: bash
        run: |
          mkdir -p build/research/experiments/001_pam04/runs
          mkdir -p build/research/site/data/experiments/runs
          for scenario in experiments/001_pam04/scenarios/*.json; do
            [ -e "$scenario" ] || continue
            name="$(basename "$scenario" .json)"
            dsc pam04-simulate \
              --experiment build/research/experiment_001_pam04.json \
              --scenario "$scenario" \
              --output "build/research/experiments/001_pam04/runs/${name}.json"
            cp "build/research/experiments/001_pam04/runs/${name}.json" "build/research/site/data/experiments/runs/${name}.json"
          done
          python - <<'PYINDEX'
          import json
          from pathlib import Path
          root=Path('build/research/experiments/001_pam04/runs')
          rows=[]
          for path in sorted(root.glob('*.json')):
              payload=json.loads(path.read_text(encoding='utf-8'))
              rows.append({'name':path.stem,'file':path.name,'parameters':payload.get('parameters',{}),'summary':payload.get('summary',{})})
          out=Path('build/research/site/data/experiments/runs/index.json')
          out.write_text(json.dumps(rows,indent=2),encoding='utf-8')
          PYINDEX
      - name: Cache official MaleCNS ROI source meshes
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/male-cns-geometry-v1
          key: male-cns-v1.0-roi-source-v1
      - name: Build optimized MaleCNS 3D geometry
        run: |
          dsc geometry-manifest \
            --output build/research/site/data/geometry.json \
            --vendor-dir build/research/site/data/geometry \
            --source-cache-dir "${{ runner.temp }}/male-cns-geometry-v1" \
            --findings build/research/findings.json \
            --experiment build/research/experiment_001_pam04.json \
            --max-vendored-skeletons 256 \
            --region-lod-divisions 20 \
            --shell-lod-divisions 46
      - name: Fetch real synapse positions for direct-connectivity findings
        continue-on-error: true
        run: |
          dsc synapse-sites \
            --findings build/research/findings.json \
            --output build/research/site/data/synapses.json \
            --max-sources 24 \
            --max-points 4000 \
            --spatial-permutations 400
      - name: Fetch real synapse positions for PAM04 live playback
        continue-on-error: true
        run: |
          dsc pam04-synapses \
            --experiment build/research/experiment_001_pam04.json \
            --output build/research/site/data/experiments/001_pam04_synapses.json \
            --max-partners 10 \
            --max-points 2500
      - name: Write research summary
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from collections import Counter
          findings = json.load(open('build/research/findings.json', encoding='utf-8'))
          manifest = json.load(open('build/research/run_manifest.json', encoding='utf-8'))
          try:
              synapses = json.load(open('build/research/site/data/synapses.json', encoding='utf-8'))
          except FileNotFoundError:
              synapses = {'total_points': 0, 'findings': {}}
          try:
              pam04 = json.load(open('build/research/experiment_001_pam04.json', encoding='utf-8'))
          except FileNotFoundError:
              pam04 = {'available': False, 'candidate_ids': []}
          try:
              pam04_syn = json.load(open('build/research/site/data/experiments/001_pam04_synapses.json', encoding='utf-8'))
          except FileNotFoundError:
              pam04_syn = {'total_points': 0}
          try:
              replication = json.load(open('build/research/experiment_001_replication.json', encoding='utf-8'))
          except FileNotFoundError:
              replication = {'overall': {'status': 'not_built'}, 'datasets': {}}
          statuses = Counter(f.get('status', 'candidate') for f in findings)
          kinds = Counter(f.get('kind', 'unknown') for f in findings)
          queue = [f for f in findings if f.get('status') in {'survived_controls', 'survived_thresholds'}]
          anatomical = manifest.get('snapshot_meta', {}).get('anatomical_null', {})
          roi_meta = anatomical.get('roi_metadata', {})
          roi_after = roi_meta.get('after', {})
          lines = [
              '# Dopaminergic State Control v0.5.0',
              '',
              f"- dopamine core: {manifest['counts'].get('dopamine_core_nodes', '—')}",
              f"- findings shown: {len(findings)}",
              f"- manual investigation queue: {len(queue)}",
              f"- real synapse points: {synapses.get('total_points', 0)}",
              f"- ROI metadata: {roi_meta.get('source', 'unknown')}",
              f"- ROI output coverage: {float(roi_after.get('output_fraction', 0))*100:.1f}%",
              f"- targets with anatomical pool: {anatomical.get('snapshot_targets_with_anatomical_pool', 0)} / {anatomical.get('snapshot_nodes', 0)}",
              f"- Experiment 001 PAM04: {'ready' if pam04.get('available') else 'unavailable'}",
              f"- PAM04 candidates: {', '.join(str(x) for x in pam04.get('candidate_ids', [])) or 'none'}",
              f"- PAM04 live synapse sites: {pam04_syn.get('total_points', 0)}",
              f"- PAM04 replication status: {replication.get('overall', {}).get('status', 'unknown')}",
              f"- BANC PAM04 tested: {replication.get('datasets', {}).get('banc', {}).get('connectivity_tested', False)}",
              f"- FlyWire PAM04 tested: {replication.get('datasets', {}).get('flywire', {}).get('connectivity_tested', False)}",
              '',
              '## Control states',
          ]
          lines += [f"- {k}: {v}" for k, v in sorted(statuses.items())]
          lines += ['', '## Detector counts']
          lines += [f"- {k}: {v}" for k, v in sorted(kinds.items())]
          lines += ['', '## Highest review candidates']
          for f in queue[:12]:
              lines.append(f"- `{f['focus_node']}` — {f['kind']} — {f['status']} — {f['summary']}")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('\n'.join(lines) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: male-cns-v1.0-dopamine-research
          path: |
            build/male-cns-v1.0-dopamine/
            build/research/
          if-no-files-found: error
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/research/site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-snapshot
    steps:
      - name: Deploy real research site
        id: deployment
        uses: actions/deploy-pages@v4
